    <!--
      An earlier build of this site registered a service worker. Anyone who
      visited it still has one, and it would keep serving that build from
      cache forever. This unregisters it once and can be removed after the
      new site has been live long enough for returning visitors to land.
    -->
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          for (let registration of registrations) registration.unregister()
        })
      }
    </script>
